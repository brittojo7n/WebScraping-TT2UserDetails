name: Automated Hourly Run

on:
  workflow_dispatch: # Allows you to run it manually from the Actions tab
  schedule:
    - cron: '0 */2 * * *' # This runs at the start of every 2nd hour

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create dataset directory
        run: mkdir -p dataset

      - name: Create or check for tt2_players.csv
        run: |
          if [ ! -f "dataset/tt2_players.csv" ]; then
            echo 'User ID,Enkord account full name,Registered' > dataset/tt2_players.csv
          fi

      - name: Scrape Missing and Anonymous IDs
        run: python main.py --mode all

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated: Hourly update of tt2_players.csv"
          file_pattern: "dataset/tt2_players.csv"
