name: Scheduled Scrape and Update

on:
  schedule:
    # Runs at 12:00 UTC every day.
    # To change the schedule, update the cron expression.
    - cron: '0 12 * * *'
  # Allows you to manually trigger the workflow from the Actions tab.
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
        # Dependencies from your requirements.txt file are:
        # beautifulsoup4
        # requests
        # urllib3

      - name: Create dataset directory
        run: mkdir -p dataset

      - name: Create or check for tt2_players.csv
        run: |
          if [ ! -f "dataset/tt2_players.csv" ]; then
            echo 'User ID,Enkord account full name,Registered' > dataset/tt2_players.csv
          fi
          
      - name: Run the script to scrape missing IDs
        run: python run.py --mode missing
